services:
  ollama:
    image: ollama/ollama:latest
    container_name: intravia-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama-model:
    image: ollama/ollama:latest
    container_name: intravia-ollama-model-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$$LLM_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    container_name: intravia-app
    restart: unless-stopped
    init: true
    environment:
      PORT: 5000
      DB_PATH: /app/database.db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      LLM_ENABLED: ${LLM_ENABLED:-1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      OLLAMA_BASE_URL: http://ollama:11434/v1/
      OLLAMA_API_KEY: ollama
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - ./database.db:/app/database.db
      - ./data:/app/data
      - whisper_cache:/root/.cache/whisper
    depends_on:
      ollama-model:
        condition: service_completed_successfully

volumes:
  ollama_data:
  whisper_cache:
